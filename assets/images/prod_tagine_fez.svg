<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="pGrad_prod_tagine_fez.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2631"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#pGrad_prod_tagine_fez.svg)"/>
  
  <!-- Subtle Moorish Arch Pattern -->
  <path d="M 120 540 L 120 280 Q 120 120 300 80 Q 480 120 480 280 L 480 540" fill="none" stroke="#5DADE2" stroke-width="2" opacity="0.25"/>
  <circle cx="300" cy="270" r="140" fill="rgba(255,255,255,0.03)" stroke="#5DADE2" stroke-width="2" stroke-dasharray="6 6"/>
  
  <!-- Floating Product Icon/Badge -->
  <circle cx="300" cy="260" r="95" fill="#1C1C1C" stroke="#5DADE2" stroke-width="3" filter="url(#shadow)"/>
  <text x="300" y="295" font-size="80" text-anchor="middle">🏺</text>
  
  <!-- Product Label -->
  <rect x="50" y="440" width="500" height="110" rx="14" fill="#181818" stroke="rgba(201, 162, 39, 0.3)" stroke-width="1.5"/>
  <text x="300" y="482" font-family="'Outfit', sans-serif" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">Fez Blue Glazed Tagine</text>
  <text x="300" y="515" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#5DADE2" font-weight="600" text-anchor="middle">Lead-Free Handmade Clay</text>
</svg>